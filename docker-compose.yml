version: '3.8'

services:
  resume-builder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personalised_resume_builder
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    restart: unless-stopped
